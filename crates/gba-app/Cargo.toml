[package]
name = "gba-app"
description = "Aplicación de escritorio y web de GBA-emulator-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
gilrs = { version = "0.11", features = ["serde-serialize"] }
gba-core = { path = "../gba-core" }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }

# Escritorio: render con wgpu.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18"
eframe = { version = "0.37", features = ["persistence"] }

# Web: render con WebGL (glow), que funciona en todos los navegadores.
[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.23"
cpal = { version = "0.18", features = ["wasm-bindgen"] }
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Storage", "Window"] }

[dev-dependencies]
ron = "0.12"
