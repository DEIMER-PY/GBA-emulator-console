name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `-D warnings` solo para el código propio: el core de terceros (vendor/) compila
      # con sus propios avisos.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  vendor-core:
    name: tests del core de terceros (gba-tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/rustboyadvance-ng/core
      - run: cargo test --release
        working-directory: vendor/rustboyadvance-ng/core
